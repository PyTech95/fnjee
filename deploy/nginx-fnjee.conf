# ---------------------------------------------------------------------------
# OPTIONAL nginx reverse proxy for FNJEE on a VPS (e.g. Hostinger).
#
# You only need this if you put nginx IN FRONT of the app/Caddy. If you do,
# nginx's DEFAULT upload limit is just 1 MB, which makes Word/PDF imports fail
# with "HTTP 413 Request Entity Too Large". The line that fixes it is:
#
#     client_max_body_size 60m;
#
# Copy to /etc/nginx/sites-available/fnjee.conf, symlink into sites-enabled,
# then: sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # THE FIX: allow large question-paper uploads (default is 1m -> 413).
    client_max_body_size 60m;

    # Long AI extractions run server-side; don't cut the connection early.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8080;   # -> Caddy (or the app) behind nginx
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;        # stream large uploads straight through
    }
}
